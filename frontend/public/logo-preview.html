<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Easy Exam Logo Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    gap: 48px;
  }
  h2 { color: #64748b; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 48px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  .label { font-size: 12px; color: #94a3b8; letter-spacing: 0.1em; }
</style>
</head>
<body>

<h2>Easy Exam — Logo Variants</h2>

<div class="row">

  <!-- 主 Logo：彩色版 -->
  <div class="card">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad1" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
        <linearGradient id="grad2" x1="120" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0EA5E9"/>
          <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
      </defs>
      <!-- 背景圆角矩形 -->
      <rect width="120" height="120" rx="28" fill="url(#grad1)"/>
      <!-- 左侧 E -->
      <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
      <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
      <!-- 右侧 E（镜像） -->
      <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <!-- 中间分隔线 -->
      <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.3"/>
    </svg>
    <div class="label">主图标 · 彩色</div>
  </div>

  <!-- 带文字的完整 Logo -->
  <div class="card">
    <svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad3" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
      </defs>
      <!-- 图标 -->
      <rect width="80" height="80" rx="18" fill="url(#grad3)"/>
      <rect x="12" y="18" width="21" height="5" rx="2.5" fill="white"/>
      <rect x="12" y="18" width="5" height="44" rx="2.5" fill="white"/>
      <rect x="12" y="37.5" width="17" height="5" rx="2.5" fill="white"/>
      <rect x="12" y="57" width="21" height="5" rx="2.5" fill="white"/>
      <rect x="47" y="18" width="21" height="5" rx="2.5" fill="white" opacity="0.85"/>
      <rect x="63" y="18" width="5" height="44" rx="2.5" fill="white" opacity="0.85"/>
      <rect x="51" y="37.5" width="17" height="5" rx="2.5" fill="white" opacity="0.85"/>
      <rect x="47" y="57" width="21" height="5" rx="2.5" fill="white" opacity="0.85"/>
      <rect x="38" y="21" width="3" height="38" rx="1.5" fill="white" opacity="0.3"/>
      <!-- 文字 -->
      <text x="96" y="36" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="22" fill="#1E3A5F" letter-spacing="-0.5">Easy</text>
      <text x="96" y="62" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="22" fill="#2563EB" letter-spacing="2">Exam</text>
    </svg>
    <div class="label">横版完整 Logo</div>
  </div>

  <!-- 深色背景版 -->
  <div class="card" style="background:#0F172A">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad4" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" rx="28" fill="url(#grad4)"/>
      <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
      <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
      <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
      <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.3"/>
    </svg>
    <div class="label" style="color:#475569">深色背景版</div>
  </div>

  <!-- 纯色单色版 -->
  <div class="card">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="28" fill="#2563EB"/>
      <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
      <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
      <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
      <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.7"/>
      <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.7"/>
      <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.7"/>
      <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.7"/>
      <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.25"/>
    </svg>
    <div class="label">纯色版</div>
  </div>

  <!-- 小尺寸图标（16/32px 场景） -->
  <div class="card">
    <div style="display:flex;gap:16px;align-items:flex-end">
      <!-- 64px -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <svg width="64" height="64" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g5" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient></defs>
          <rect width="120" height="120" rx="28" fill="url(#g5)"/>
          <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
          <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.3"/>
        </svg>
        <span style="font-size:11px;color:#94a3b8">64px</span>
      </div>
      <!-- 32px -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <svg width="32" height="32" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g6" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient></defs>
          <rect width="120" height="120" rx="28" fill="url(#g6)"/>
          <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
          <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.3"/>
        </svg>
        <span style="font-size:11px;color:#94a3b8">32px</span>
      </div>
      <!-- 16px -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g7" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient></defs>
          <rect width="120" height="120" rx="28" fill="url(#g7)"/>
          <rect x="18" y="28" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="28" width="7" height="64" rx="3.5" fill="white"/>
          <rect x="18" y="56.5" width="26" height="7" rx="3.5" fill="white"/>
          <rect x="18" y="85" width="32" height="7" rx="3.5" fill="white"/>
          <rect x="70" y="28" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="95" y="28" width="7" height="64" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="76" y="56.5" width="26" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="70" y="85" width="32" height="7" rx="3.5" fill="white" opacity="0.85"/>
          <rect x="58" y="32" width="4" height="56" rx="2" fill="white" opacity="0.3"/>
        </svg>
        <span style="font-size:11px;color:#94a3b8">16px</span>
      </div>
    </div>
    <div class="label">多尺寸适配</div>
  </div>

</div>

<p style="color:#94a3b8;font-size:12px">预览文件 · Easy Exam Logo Design</p>

</body>
</html>
